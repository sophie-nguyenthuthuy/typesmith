<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>typesmith — paste data, get types</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #2d333b;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --ok: #3fb950;
    --err: #f85149;
    font-size: 15px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --panel: #ffffff; --border: #d0d7de;
      --text: #1f2328; --muted: #656d76; --accent: #0969da;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  header h1 span { color: var(--accent); }
  header .tagline { color: var(--muted); font-size: 0.85rem; }
  header .spacer { flex: 1; }
  header a { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
  header a:hover { color: var(--accent); }
  main { display: flex; flex: 1; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane + .pane { border-left: 1px solid var(--border); }
  .bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .bar label { color: var(--muted); font-size: 0.8rem; }
  #rootname {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; width: 9em; font: inherit; font-size: 0.85rem;
  }
  #badge {
    font-size: 0.75rem; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted);
  }
  #badge.ok { color: var(--ok); border-color: var(--ok); }
  #badge.err { color: var(--err); border-color: var(--err); }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 10px; font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.tab.active { border-color: var(--accent); color: var(--accent); background: var(--bg); }
  textarea {
    flex: 1; resize: none; border: 0; outline: none; padding: 12px;
    background: transparent; color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem;
    line-height: 1.5;
  }
  #output {
    flex: 1; overflow: auto; margin: 0; padding: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem;
    line-height: 1.5; white-space: pre; tab-size: 4;
  }
  #error { color: var(--err); padding: 12px; font-size: 0.85rem; display: none; }
  @media (max-width: 800px) {
    main { flex-direction: column; }
    .pane + .pane { border-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>type<span>smith</span></h1>
  <div class="tagline">paste JSON, NDJSON, or CSV → get types</div>
  <div class="spacer"></div>
  <a href="https://github.com/sophie-nguyenthuthuy/typesmith">github</a>
</header>
<main>
  <section class="pane">
    <div class="bar">
      <span id="badge">waiting for input</span>
      <div class="spacer" style="flex:1"></div>
      <button id="sample">Load sample</button>
      <button id="clear">Clear</button>
    </div>
    <textarea id="input" spellcheck="false"
      placeholder='Paste JSON, an array of records, NDJSON lines, or CSV with a header row…'></textarea>
  </section>
  <section class="pane">
    <div class="bar" id="tabs">
      <label for="rootname">root</label>
      <input id="rootname" value="Root" spellcheck="false" />
      <div class="spacer" style="flex:1"></div>
      <button id="copy">Copy</button>
    </div>
    <div id="error"></div>
    <pre id="output"></pre>
  </section>
</main>
<script type="module">
  import { analyze } from './src/detect.js';
  import { emitters } from './src/emit/index.js';

  const $ = (id) => document.getElementById(id);
  const input = $('input'), output = $('output'), badge = $('badge'), errBox = $('error');
  const tabsBar = $('tabs'), rootname = $('rootname');

  let active = localStorage.getItem('typesmith.tab') || emitters[0].id;

  // Build one tab per registered emitter — adding an emitter file adds a tab.
  const copyBtn = $('copy');
  for (const e of emitters) {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.id = e.id;
    b.textContent = e.label;
    b.addEventListener('click', () => { active = e.id; localStorage.setItem('typesmith.tab', e.id); render(); });
    tabsBar.insertBefore(b, tabsBar.querySelector('.spacer'));
  }

  const FORMAT_LABEL = {
    'json-object': 'JSON object', 'json-array': 'JSON array',
    'json-value': 'JSON value', 'ndjson': 'NDJSON', 'csv': 'CSV',
  };

  function render() {
    for (const b of tabsBar.querySelectorAll('.tab')) {
      b.classList.toggle('active', b.dataset.id === active);
    }
    const text = input.value;
    if (text.trim() === '') {
      badge.textContent = 'waiting for input';
      badge.className = '';
      errBox.style.display = 'none';
      output.textContent = '';
      return;
    }
    try {
      const { ir, format, isCollection } = analyze(text);
      const emitter = emitters.find((e) => e.id === active) ?? emitters[0];
      output.textContent = emitter.emit(ir, { rootName: rootname.value.trim() || 'Root', isCollection, format });
      badge.textContent = FORMAT_LABEL[format] ?? format;
      badge.className = 'ok';
      errBox.style.display = 'none';
      output.style.display = 'block';
    } catch (e) {
      badge.textContent = 'error';
      badge.className = 'err';
      errBox.textContent = e.message;
      errBox.style.display = 'block';
      output.textContent = '';
    }
  }

  let timer;
  const debounced = () => { clearTimeout(timer); timer = setTimeout(render, 150); };
  input.addEventListener('input', debounced);
  rootname.addEventListener('input', debounced);

  copyBtn.addEventListener('click', async () => {
    await navigator.clipboard.writeText(output.textContent);
    copyBtn.textContent = 'Copied ✓';
    setTimeout(() => (copyBtn.textContent = 'Copy'), 1200);
  });

  $('clear').addEventListener('click', () => { input.value = ''; render(); });
  $('sample').addEventListener('click', () => {
    input.value = JSON.stringify([
      {
        id: 1, name: 'Linh', email: 'linh@example.com',
        signup_date: '2026-01-15', last_seen: '2026-08-01T09:30:00Z',
        score: 4.5, active: true, tags: ['pro', 'beta'],
        address: { city: 'Hanoi', zip: '10000' },
      },
      {
        id: 2, name: 'Minh', email: 'minh@example.com',
        signup_date: '2026-02-20', last_seen: null,
        score: 3, active: false, tags: [],
      },
    ], null, 2);
    rootname.value = 'User';
    render();
  });

  render();
</script>
</body>
</html>
